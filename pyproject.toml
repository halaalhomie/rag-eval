[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-forge"
version = "0.1.0"
description = "Evaluation-driven adaptive RAG system: hybrid retrieval, reranking, corrective and Self-RAG-inspired loops, with a reproducible experiment framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Dependencies are added phase by phase, when the code that needs them lands.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # ingestion
    "pypdf>=4.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # retrieval / generation
    "sentence-transformers>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local LLM server for development (Apple Silicon only). Runs on the host, not in Docker:
#   mlx_lm.server --model mlx-community/Qwen2.5-3B-Instruct-4bit --port 8080
local-llm = [
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL+pgvector instance (DATABASE_URL)",
    "slow: loads ML models or performs heavy computation",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
