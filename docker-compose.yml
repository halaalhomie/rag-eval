services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragforge}
      POSTGRES_DB: ${POSTGRES_DB:-ragforge}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragforge}:${POSTGRES_PASSWORD:-ragforge}@postgres:5432/${POSTGRES_DB:-ragforge}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/data
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  models:
